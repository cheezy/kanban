# The Xcode project, described for XcodeGen. Generate it from this directory
# with `xcodegen generate`; the Stride.xcodeproj it writes is git-ignored.
#
# No signing team or profile belongs here. A simulator build needs neither, and
# a device or archive build passes DEVELOPMENT_TEAM on the command line.
name: Stride

options:
  minimumXcodeGenVersion: 2.47.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # The app and the widgets share Stride/Resources/Fonts; nested groups keep
  # its files in one group, where Xcode refuses a file that is in two.
  createIntermediateGroups: true
  # Pins every Swift package, direct or not. Xcode reads the pins from inside
  # the generated project, so the committed Package.resolved is copied there.
  postGenCommand: mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/

packages:
  StrideKit:
    path: StrideKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # mix mobile.strings writes the string catalog: Xcode makes a Swift symbol of
    # each string in it, and adds none of its own.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # Every identifier below comes from this one. It is the bundle id the server
    # is given as STRIDE_IOS_BUNDLE_ID and APNS_TOPIC.
    STRIDE_BUNDLE_ID: com.stridelikeaboss.app
    # The groups the app and both extensions share. The entitlements grant them
    # and each Info.plist names them, so StrideKit reads them from the bundle.
    STRIDE_APP_GROUP: group.$(STRIDE_BUNDLE_ID)
    STRIDE_KEYCHAIN_GROUP: $(STRIDE_BUNDLE_ID).shared
  configs:
    Debug:
      STRIDE_APS_ENVIRONMENT: development
    Release:
      STRIDE_APS_ENVIRONMENT: production

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - path: Stride
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIDE_BUNDLE_ID)
        INFOPLIST_FILE: Stride/Info.plist
        CODE_SIGN_ENTITLEMENTS: Stride/Stride.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Stride
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: StrideKit
      - target: StrideWidgets
      - target: StrideNotificationService

  StrideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StrideWidgets
      - path: Stride/Resources/Fonts
        buildPhase: resources
        excludes:
          - "*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIDE_BUNDLE_ID).widgets
        INFOPLIST_FILE: StrideWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: StrideWidgets/StrideWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Stride
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: StrideKit

  StrideNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: StrideNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIDE_BUNDLE_ID).notification-service
        INFOPLIST_FILE: StrideNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: StrideNotificationService/StrideNotificationService.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Stride
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: StrideKit

  # Hosted in the app and not linked to StrideKit itself, so a test that reaches
  # StrideKit proves the app links it.
  StrideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrideTests
      # The text the string catalog must hold.
      - path: ../shared/strings
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIDE_BUNDLE_ID).tests
    dependencies:
      - target: Stride

  StrideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StrideUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STRIDE_BUNDLE_ID).uitests
    dependencies:
      - target: Stride

schemes:
  # The names .github/workflows/ios.yml builds and tests.
  Stride:
    build:
      targets:
        Stride: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrideTests
        - StrideUITests
        - package: StrideKit/StrideKitTests
    archive:
      config: Release
